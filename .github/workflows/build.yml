name: CI

on:
  # CI is a reusable release gate. Ordinary pushes and pull requests do not
  # run it; the Release workflow calls it immediately before packaging.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jurplel/install-qt-action@v4
        if: runner.os == 'macOS'
        with:
          version: '6.9.0'
          modules: 'qtshadertools'
          cache: true
      - name: Install image libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install libraw exiv2 jpeg-turbo jpeg-xl openexr pkgconf
      - name: Set up MSYS2/UCRT64
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-shadertools
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-libraw
            mingw-w64-ucrt-x86_64-exiv2
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-libjxl
            mingw-w64-ucrt-x86_64-openexr
            mingw-w64-ucrt-x86_64-lcms2
      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: >-
          cmake --preset macos-debug
          -DCMAKE_PREFIX_PATH="$(brew --prefix)"
          -DMVPVIEW_ENABLE_UI_TESTS=ON
          -DMVPVIEW_GITHUB_REPOSITORY="${GITHUB_REPOSITORY}"
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: cmake --build --preset macos-debug
      - name: Application tests (macOS)
        if: runner.os == 'macOS'
        run: ctest --test-dir build/macos-preset-debug --output-on-failure --no-tests=error
      - name: QML static analysis (macOS)
        if: runner.os == 'macOS'
        run: cmake --build --preset macos-debug --target LumenQml_qmllint
      - name: Configure (Windows MSYS2/UCRT64)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          MSYS2_UCRT64: C:/msys64/ucrt64
        run: >-
          cmake --preset windows-msys2-debug
          -DMVPVIEW_ENABLE_UI_TESTS=ON
          -DMVPVIEW_GITHUB_REPOSITORY="${GITHUB_REPOSITORY}"
          ${{ hashFiles('tests/CMakeLists.txt') != '' && '-DMVPVIEW_ENABLE_GRAPHICS_TESTS=ON' || '' }}
      - name: Build (Windows MSYS2/UCRT64)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake --build --preset windows-msys2-debug
      - name: Application tests (Windows MSYS2/UCRT64)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          # Hosted runners can run the Qt Quick RHI tests with the D3D11 software adapter.
          QSG_RHI_BACKEND: d3d11
          QSG_RHI_PREFER_SOFTWARE_RENDERER: '1'
          QSG_INFO: '1'
          QT_FORCE_STDERR_LOGGING: '1'
        run: ctest --test-dir build/windows-msys2-debug --output-on-failure --no-tests=error
      - name: QML static analysis (Windows MSYS2/UCRT64)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake --build --preset windows-msys2-debug --target LumenQml_qmllint
